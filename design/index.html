<!DOCTYPE html>
<html lang="he" dir="rtl">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>AIT - בחירת עיצוב</title>
<style>
  * { margin: 0; padding: 0; box-sizing: border-box; }
  html, body { height: 100%; font-family: "Segoe UI", Arial, sans-serif; background: #1a1a1e; }
  .bar {
    display: flex; align-items: center; gap: 12px;
    padding: 10px 18px; background: #101014; border-bottom: 1px solid #2a2a30;
    position: sticky; top: 0; z-index: 10;
  }
  .bar .title { color: #fff; font-weight: 700; font-size: 15px; }
  .bar .hint { color: #8b8b94; font-size: 12px; margin-inline-start: auto; }
  .tabs { display: flex; gap: 6px; }
  .tabs button {
    border: 1px solid #34343c; background: #1c1c22; color: #cfcfd6;
    padding: 8px 18px; border-radius: 8px; font-size: 14px; font-family: inherit;
    cursor: pointer; transition: all 140ms ease;
  }
  .tabs button:hover { background: #26262e; color: #fff; }
  .tabs button.active { background: #fff; color: #101014; border-color: #fff; font-weight: 700; }
  iframe {
    display: block; width: 100%; height: calc(100vh - 49px); border: 0; background: #fff;
  }
</style>
</head>
<body>
  <div class="bar">
    <span class="title">AIT - השוואת עיצובים</span>
    <div class="tabs" id="tabs">
      <button data-src="variant-modern.html">מודרני בהיר</button>
      <button data-src="variant-dark.html">כהה פרימיום</button>
      <button data-src="variant-creative.html">עיתון האבחון</button>
    </div>
    <span class="hint">בכל עיצוב: בוחרים פלטה ופונט למעלה, ומחליפים פריסה לכל מסך עם החצים</span>
  </div>
  <iframe id="frame" src="variant-modern.html" title="תצוגת עיצוב"></iframe>
  <script>
    const tabs = document.querySelectorAll("#tabs button");
    const frame = document.getElementById("frame");
    function activate(btn) {
      tabs.forEach((b) => b.classList.toggle("active", b === btn));
      frame.src = btn.dataset.src;
    }
    tabs.forEach((b) => b.addEventListener("click", () => activate(b)));
    activate(tabs[0]);
  </script>
</body>
</html>
