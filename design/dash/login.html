<!DOCTYPE html>
<html dir="rtl" lang="he">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>AIT · כניסה</title>
<script>try{var t=localStorage.getItem("ait-theme");if(t==="light")document.documentElement.setAttribute("data-theme","light");}catch(e){}</script>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Rubik:wght@300..900&display=swap" rel="stylesheet">
<link rel="stylesheet" href="style.css">
</head>
<body>

<div class="orbs" aria-hidden="true"><div class="orb a"></div><div class="orb b"></div><div class="orb c"></div></div>
<div class="grid-tex" aria-hidden="true"></div>

<nav class="land-nav">
  <a class="brand" href="landing.html">
    <span class="brand-mark">AIT</span>
    <span class="brand-txt"><small>יועץ דיגיטלי לעסקים</small><b>AIT</b></span>
  </a>
  <div class="side">
    <button class="icon-btn theme-tgl" aria-label="החלפת תצוגה">
      <svg class="ic-moon" width="17" height="17" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.7" stroke-linecap="round" stroke-linejoin="round"><path d="M21 12.8A8.5 8.5 0 1 1 11.2 3a7 7 0 0 0 9.8 9.8z"/></svg>
      <svg class="ic-sun" width="17" height="17" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.7" stroke-linecap="round"><circle cx="12" cy="12" r="4"/><path d="M12 2v2M12 20v2M4.9 4.9l1.4 1.4M17.7 17.7l1.4 1.4M2 12h2M20 12h2M4.9 19.1l1.4-1.4M17.7 6.3l1.4-1.4"/></svg>
    </button>
  </div>
</nav>

<main class="auth">
  <div class="auth-shell shell rv d1">
    <div class="core auth-core">
      <div class="mark-row"><span class="brand-mark" style="width:44px;height:44px;border-radius:14px;font-size:15px">AIT</span></div>
      <h1>נכנסים עם אימייל</h1>
      <p class="sub">בלי סיסמאות לזכור. שולחים לך <b>קישור כניסה</b> למייל, לוחצים עליו, ואתה בפנים.</p>

      <label class="field">
        <svg width="17" height="17" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.6" stroke-linecap="round"><rect x="3" y="5" width="18" height="14" rx="3"/><path d="m4 7 8 6 8-6"/></svg>
        <input type="email" inputmode="email" placeholder="האימייל של העסק">
      </label>

      <button class="btn wide">
        שלח לי קישור כניסה
        <span class="cap">
          <svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"><path d="M19 12H5"/><path d="m12 19-7-7 7-7"/></svg>
        </span>
      </button>

      <div class="auth-hint">
        <svg width="15" height="15" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.7" stroke-linecap="round" stroke-linejoin="round"><circle cx="12" cy="12" r="9"/><path d="M12 8v4M12 16h.01"/></svg>
        <span>חשוב לפתוח את הקישור באותו דפדפן שממנו ביקשת אותו. הקישור תקף לשעה אחת.</span>
      </div>

      <div class="auth-alt">
        עוד אין לך חשבון? <a href="onboarding.html">מתחילים בסריקה חינם</a>
      </div>
    </div>
  </div>
</main>

<script src="script.js"></script>
</body>
</html>
